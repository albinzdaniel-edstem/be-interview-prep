spring:
  application:
    name: app
  datasource:
    url: ${DB_URL:jdbc:h2:mem:app;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  links:
    base-url: ${SHORT_LINK_BASE_URL:http://localhost:8080}
