spring:
  application:
    name: app
  datasource:
    url: ${DB_URL:jdbc:h2:mem:app;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  cache:
    type: caffeine
    cache-names: products
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  data:
    web:
      pageable:
        max-page-size: 100
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: app
      ttl: 15m
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  links:
    base-url: ${SHORT_LINK_BASE_URL:http://localhost:8080}
